# Music EQ (ytmusic-player plugin), shown as "YouTube Music" in audio settings: a 3-band equalizer that Chromium's sound (YouTube Music)
# passes through. Gains are set live by the plugin's bin/music-eq from
# ~/.config/ytmusic-player/settings.json "music": {"eq": {...}}; 0 dB here = flat.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "YouTube Music"
      media.name       = "YouTube Music"
      filter.graph = {
        nodes = [
          { type = builtin name = bass   label = bq_lowshelf  control = { "Freq" = 110.0  "Q" = 0.7 "Gain" = 0.0 } }
          { type = builtin name = mid    label = bq_peaking   control = { "Freq" = 1000.0 "Q" = 0.8 "Gain" = 0.0 } }
          { type = builtin name = treble label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = 0.0 } }
        ]
        links = [
          { output = "bass:Out" input = "mid:In" }
          { output = "mid:Out"  input = "treble:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "ytmusic_player_eq"
        node.description = "YouTube Music"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name    = "ytmusic_player_eq_out"
        node.description = "YouTube Music"
        node.passive = true
      }
    }
  }
]
